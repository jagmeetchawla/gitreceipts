[package]
name = "gitreceipts"
version = "0.1.1"
edition = "2024"
rust-version = "1.90"
description = "See what your agent actually did: reconcile a coding-agent session against the git history it claims to explain."
license = "MIT"
repository = "https://github.com/jagmeetchawla/gitreceipts"
readme = "README.md"
keywords = ["git", "agent", "audit", "ai", "claude"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "git-receipts"
path = "src/main.rs"

# The shipped binary: thin, fast, honest-sized. LTO + one codegen unit for the
# optimizer's full view; symbols stripped (backtraces aren't part of the UX —
# errors are anyhow contexts).
[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive"] }
clap_mangen = "0.3.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
