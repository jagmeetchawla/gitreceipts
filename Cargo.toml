[package]
name = "gitreceipts"
version = "0.1.0"
edition = "2024"
description = "See what your agent actually did: reconcile a coding-agent session against the git history it claims to explain."
license = "MIT"
repository = "https://github.com/cloudcraft-ai/gitreceipts"

[[bin]]
name = "git-receipts"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
